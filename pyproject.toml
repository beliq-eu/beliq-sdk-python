[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beliq"
version = "0.3.8"
description = "Official beliq SDK: generate, validate, parse, and convert EU-compliant e-invoices (XRechnung, ZUGFeRD, Factur-X, Peppol BIS) against authority-pinned, drift-checked rules."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "beliq", email = "hello@beliq.eu" }]
keywords = ["beliq", "e-invoice", "einvoice", "xrechnung", "zugferd", "factur-x", "peppol", "en16931", "compliance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27", "pydantic>=2"]

[project.urls]
Homepage = "https://beliq.eu"
Repository = "https://github.com/beliq-eu/beliq-sdk-python"
Issues = "https://github.com/beliq-eu/beliq-sdk-python/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/beliq"]

# An allowlist: without one hatchling puts every tracked file of the repo into
# the sdist. hatchling adds pyproject.toml, PKG-INFO and .gitignore itself.
[tool.hatch.build.targets.sdist]
include = ["/src/beliq", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# C901, PLR0913 and PLR0915 cap a function at complexity 25, 6 parameters and 50 statements.
# A function that was over a cap when the caps came in carries a `# noqa` for it with that
# date, and RUF100 fails the noqa once the function is back under the cap, so the list of
# exceptions only shrinks.
select = ["E", "F", "I", "UP", "B", "RUF100", "C901", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pylint]
max-args = 6
max-statements = 50

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/beliq", "scripts"]
