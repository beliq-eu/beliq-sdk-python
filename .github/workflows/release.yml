name: Release

# Publishes beliq to PyPI via Trusted Publishing (OIDC) - no API token needed.
# Attestations are generated automatically. Trigger by pushing a version tag
# (e.g. v0.1.1) or running the workflow manually.
#
# One-time setup on pypi.org: register beliq-eu/beliq-sdk-python as a Trusted
# Publisher for the beliq project (workflow `release.yml`, environment `pypi`).
# Prefer a pending publisher so the very first tag run creates the project via
# OIDC with no local upload.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# One release at a time, never cancelled midway: two tags pushed together would
# otherwise publish in parallel and finish in either order. GitHub keeps one
# waiting run per group, so a third tag cancels the waiting one; re-run it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the guard below needs main's history
      # workflow_dispatch offers every branch, and a tag can point at any commit.
      # This stops a release from the wrong place by mistake. It is no defence
      # against an edit to this file: a tag runs the workflow as of its commit.
      - name: Release only from a vX.Y.Z tag on main
        run: |
          if ! [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::a release runs from a vX.Y.Z tag, not from $GITHUB_REF"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $(git rev-parse --short HEAD), which is not on main"
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.17'
          python-version: '3.14'
          activate-environment: true
          # A release runs once, so a restored cache would only be one more input to trust.
          enable-cache: false
      - run: uv sync --locked --extra dev
      - run: ruff check src tests
      - run: mypy
      - run: pytest

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: pyproject.toml version matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          test "$want" = "$have" || {
            echo "tag says $want, pyproject.toml says $have"
            exit 1
          }

      - name: Build
        run: |
          python -m pip install build
          python -m build
      # No `password`: the action exchanges the GitHub OIDC token with PyPI.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1